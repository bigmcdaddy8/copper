[project]
name = "dicks_laboratory"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "matplotlib>=3.9",
]

[project.scripts]
dicks_laboratory = "dicks_laboratory.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dicks_laboratory"]