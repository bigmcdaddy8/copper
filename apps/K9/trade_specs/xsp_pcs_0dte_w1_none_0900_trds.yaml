schema_version: 2
notes: XSP 0DTE Put Credit Spread - ~13 delta short put, $1 wing, no TP - let it expire
enabled: true
environment: TRD
underlying: XSP

trade:
  option_strategy: PCS

  entry_constraints:
    allow_multiple_trades: false
    quantity: 1
    max_entries_per_day: 4
    # max_entries_per_day: 100
    max_risk_dollars: 100.0

  entry_criteria:
    type: time_window
    allowed_entry_after: "08:55" # Chicago time
    # allowed_entry_before: "09:21" # Chicago time
    allowed_entry_before: "14:21" # Chicago time

  entry_order:
    order_type: LIMIT
    time_in_force: DAY
    max_fill_wait_time_seconds: 120
    max_entry_attempts: 5
    retry_price_decrement: 0.02
    entry_price: MIDPOINT
    min_credit_received: 0.01

  leg_selection:
    short_put:
      delta_preferred: -0.30
      delta_range:
        min: -0.40
        max: -0.20
    long_put:
      wing_distance_points: 1.0

  exit_order:
    exit_type: NONE
